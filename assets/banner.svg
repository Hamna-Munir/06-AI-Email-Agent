<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#11161d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- Top: compact title row -->
  <text x="60" y="46" font-family="Arial, sans-serif" font-size="12" letter-spacing="3.5" fill="#2dd4bf" font-weight="700">WEEK 06</text>
  <text x="60" y="76" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#f8fafc">AI Email Agent</text>
  <text x="60" y="100" font-family="Arial, sans-serif" font-size="14" fill="#8b95a5">Understands, drafts, and acts on email — asking before anything sensitive.</text>

  <!-- Signature visual: a full-width horizontal pipeline, the actual
       agent decision flow, rendered as the dominant element instead
       of a small side icon -->
  <g transform="translate(60, 150)">

    <!-- connecting line -->
    <line x1="30" y1="45" x2="1080" y2="45" stroke="#293241" stroke-width="2"/>

    <!-- Step 1: Email received -->
    <circle cx="30" cy="45" r="26" fill="#161d27" stroke="#2dd4bf" stroke-width="2"/>
    <path d="M18 38 L30 47 L42 38" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="18" y="34" width="24" height="16" rx="2" fill="none" stroke="#2dd4bf" stroke-width="2"/>
    <text x="30" y="92" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#94a3b8">Email In</text>

    <!-- Step 2: Analyze -->
    <circle cx="290" cy="45" r="26" fill="#161d27" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="290" cy="40" r="6" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <line x1="294.5" y1="44.5" x2="301" y2="51" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <text x="290" y="92" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#94a3b8">Analyze + Classify</text>

    <!-- Step 3: Choose tool -->
    <circle cx="550" cy="45" r="26" fill="#161d27" stroke="#818cf8" stroke-width="2"/>
    <rect x="539" y="34" width="9" height="9" rx="2" fill="none" stroke="#818cf8" stroke-width="1.8"/>
    <rect x="552" y="34" width="9" height="9" rx="2" fill="none" stroke="#818cf8" stroke-width="1.8"/>
    <rect x="545.5" y="47" width="9" height="9" rx="2" fill="#818cf8"/>
    <text x="550" y="92" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#94a3b8">Choose Tool</text>

    <!-- Step 4: Confirmation gate (visually distinct - the safety checkpoint) -->
    <circle cx="810" cy="45" r="30" fill="#1c1712" stroke="#fbbf24" stroke-width="2.5"/>
    <path d="M797 45 L806 54 L823 35" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="810" y="96" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#fbbf24" font-weight="700">Confirm?</text>

    <!-- Step 5: Action complete -->
    <circle cx="1070" cy="45" r="26" fill="#161d27" stroke="#34d399" stroke-width="2"/>
    <path d="M1059 45 L1067 53 L1082 37" fill="none" stroke="#34d399" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1070" y="92" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#94a3b8">Action Sent</text>

    <!-- arrow markers between nodes -->
    <path d="M160 45 L164 41 M160 45 L164 49" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
    <path d="M420 45 L424 41 M420 45 L424 49" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
    <path d="M678 45 L682 41 M678 45 L682 49" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
    <path d="M942 45 L946 41 M942 45 L946 49" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  </g>

  <rect x="0" y="298" width="1200" height="2" fill="url(#accent)" opacity="0.55"/>
</svg>
